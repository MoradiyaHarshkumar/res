<!DOCTYPE html>
<html ng-app="taskApp">
<head>
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="angular.js"></script>
  <script src="controller.js"></script>
</head>
<body ng-controller="TaskController" class="container mt-4">
  <h1 class="mb-4 text-primary">Task Manager</h1>

  <div class="input-group mb-3">
    <input type="text" ng-model="newTaskName" class="form-control" placeholder="Enter task name">
    <button class="btn btn-success" ng-click="addTask()">Add Task</button>
  </div>

  <div class="input-group mt-4 mb-3">
    <input type="text" ng-model="searchName" class="form-control" placeholder="Enter task name to search">
    <button class="btn btn-info" ng-click="getTaskByName()">Search</button>
  </div>

  <ul class="list-group mb-4" ng-if="searchedTasks.length">
    <li class="list-group-item" ng-repeat="task in searchedTasks">
      {{task.taskID}} - {{task.taskName}} ({{task.status}})
    </li>
  </ul>

  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center" ng-repeat="task in tasks">
      <div class="d-flex flex-column flex-md-row align-items-md-center gap-2">
        <input type="text" ng-model="task.taskName" class="form-control form-control-sm">
        <select ng-model="task.status" class="form-select form-select-sm">
          <option>Started</option>
          <option>In Progress</option>
          <option>Completed</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary btn-sm" ng-click="updateTask(task)">Update</button>
        <button class="btn btn-danger btn-sm" ng-click="deleteTask(task.taskID)">Delete</button>
      </div>
    </li>
  </ul>
</body>
</html>
